<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFFAF0"/>
      <stop offset="100%" stop-color="#FFF0E0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)" rx="20"/>
  <!-- Body -->
  <ellipse cx="200" cy="250" rx="80" ry="90" fill="#FFE4B0"/>
  <!-- Head -->
  <circle cx="200" cy="160" r="72" fill="#FFF0C8"/>
  <!-- Tired eyes (half-closed) -->
  <ellipse cx="178" cy="155" rx="14" ry="8" fill="#8B5020"/>
  <ellipse cx="222" cy="155" rx="14" ry="8" fill="#8B5020"/>
  <!-- Whites of eyes -->
  <ellipse cx="178" cy="155" rx="11" ry="5" fill="white"/>
  <ellipse cx="222" cy="155" rx="11" ry="5" fill="white"/>
  <!-- Pupils -->
  <circle cx="178" cy="156" r="4" fill="#5A3010"/>
  <circle cx="222" cy="156" r="4" fill="#5A3010"/>
  <!-- Heavy eyelids -->
  <path d="M164 151 Q178 147 192 151" stroke="#8B5020" stroke-width="4" fill="none"/>
  <path d="M208 151 Q222 147 236 151" stroke="#8B5020" stroke-width="4" fill="none"/>
  <!-- Tired sweat drops -->
  <ellipse cx="248" cy="140" rx="5" ry="8" fill="#A0D0FF" opacity="0.7"/>
  <!-- Blush -->
  <ellipse cx="163" cy="173" rx="15" ry="9" fill="#FFB870" opacity="0.5"/>
  <ellipse cx="237" cy="173" rx="15" ry="9" fill="#FFB870" opacity="0.5"/>
  <!-- Small mouth / slight smile -->
  <path d="M188 180 Q200 190 212 180" stroke="#B07030" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Trophy -->
  <rect x="160" y="290" width="80" height="14" fill="#E8B030" rx="4"/>
  <rect x="178" y="304" width="44" height="10" fill="#C89020" rx="3"/>
  <path d="M172 270 L228 270 L220 290 L180 290 Z" fill="#F9D040"/>
  <path d="M172 270 Q158 255 162 240 Q165 230 178 235 L172 270 Z" fill="#F9D040"/>
  <path d="M228 270 Q242 255 238 240 Q235 230 222 235 L228 270 Z" fill="#F9D040"/>
  <text x="200" y="287" text-anchor="middle" font-size="16" fill="#B08010">★</text>
  <!-- Confetti -->
  <rect x="60" y="70" width="12" height="7" fill="#E8A4B8" rx="2" transform="rotate(30 60 70)"/>
  <rect x="300" y="80" width="10" height="6" fill="#C4B5D4" rx="2" transform="rotate(-20 300 80)"/>
  <rect x="80" y="300" width="8" height="5" fill="#F9D84A" rx="2" transform="rotate(15 80 300)"/>
  <rect x="320" y="310" width="11" height="6" fill="#F4B8C8" rx="2" transform="rotate(-35 320 310)"/>
  <circle cx="330" cy="130" r="5" fill="#F2C9A0"/>
  <circle cx="70" cy="200" r="4" fill="#E8A4B8"/>
</svg>
