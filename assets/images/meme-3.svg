<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#F8F0FF"/>
      <stop offset="100%" stop-color="#F0E8FF"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg3)" rx="20"/>
  <!-- Body -->
  <ellipse cx="200" cy="255" rx="78" ry="82" fill="#DDD0F0"/>
  <!-- Head -->
  <circle cx="200" cy="162" r="76" fill="#EEE4FF"/>
  <!-- Swirl eyes (confused) -->
  <!-- Left swirl -->
  <circle cx="175" cy="155" r="18" fill="white" stroke="#9070C0" stroke-width="2"/>
  <path d="M175 148 Q183 148 183 155 Q183 162 175 162 Q170 162 170 157 Q170 152 175 152" fill="none" stroke="#9070C0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="175" cy="155" r="3" fill="#9070C0"/>
  <!-- Right swirl -->
  <circle cx="225" cy="155" r="18" fill="white" stroke="#9070C0" stroke-width="2"/>
  <path d="M225 148 Q233 148 233 155 Q233 162 225 162 Q220 162 220 157 Q220 152 225 152" fill="none" stroke="#9070C0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="225" cy="155" r="3" fill="#9070C0"/>
  <!-- Blush -->
  <ellipse cx="158" cy="175" rx="15" ry="9" fill="#C4A4E0" opacity="0.4"/>
  <ellipse cx="242" cy="175" rx="15" ry="9" fill="#C4A4E0" opacity="0.4"/>
  <!-- Wavy confused mouth -->
  <path d="M182 186 Q190 180 200 186 Q210 192 218 186" stroke="#7050A0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Question marks floating around -->
  <text x="60" y="110" font-size="36" fill="#B090D0" opacity="0.6" transform="rotate(-15 60 110)">?</text>
  <text x="310" y="100" font-size="28" fill="#9070C0" opacity="0.7" transform="rotate(10 310 100)">?</text>
  <text x="50" y="280" font-size="24" fill="#C4A4E0" opacity="0.6" transform="rotate(-8 50 280)">?</text>
  <text x="330" y="290" font-size="32" fill="#B090D0" opacity="0.5" transform="rotate(20 330 290)">?</text>
  <text x="280" y="160" font-size="22" fill="#D0B8F0" opacity="0.6" transform="rotate(-5 280 160)">?</text>
  <!-- Party streamers -->
  <path d="M40 40 Q80 70 60 110 Q40 150 80 180" stroke="#E8A4B8" stroke-width="3" fill="none" opacity="0.5" stroke-dasharray="8 4"/>
  <path d="M360 40 Q320 70 340 110 Q360 150 320 180" stroke="#C4B5D4" stroke-width="3" fill="none" opacity="0.5" stroke-dasharray="8 4"/>
